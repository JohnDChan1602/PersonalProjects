<!DOCTYPE html>
<html>
    <head>
        <link href="https://googleapis.com" rel="stylesheet">
        <style>
            body{
                background-image:   url("jsPro1NumberGuessBackground.jpg");
                height:             100vh;
                display:            flex;
                /*Horizontal Adjustment*/
                justify-content:    center;
                /*Vertical Adjustment*/
                align-items:        center;
            }

            .container{
                background-color:   white;
                padding:            30px;
                border-radius:      10px;
                width:              300px;
                box-shadow:         0, 0, 10px rgba(0,0,0,0.1);
                display:            flex;
                flex-direction:     column;
                justify-content:    center;
                align-items:        center;
                font-family:        'Roboto', sans-serif;
            }

            .button{
                background-color:   orange;
                border:             none;
                border-radius:      8px;
                padding:            15px 32px;
                font-size:          14px;
                font-family:        'Roboto', sans-serif;
            }
        </style>
    </head>
    
    <!-- Generate random number on page load -->
    <body onload="generateRandom()">
        <div class="container">
        
            <!-- Main Interface -->
            <h1>JavaScript Project 1</h1>
            <h2>Number Guessing Game</h2>

            <!-- User inputs a number and clicks to guess -->
            <p id="guessScore"></p>
            <p>Try and Guess What Number I am Thinking Of:</p>
            <p>(Hint: It's a number between 1 and 10)</p>
            <input type="text" id="guessNum" name="guessNum"><br>
        
            <button class="button" id="buttonGuess" onclick="guessNumber()">Guess</button>

            <!-- Result is shown here -->
            <p id="guessResult"></p>

            <!-- User clicks this button to generate another random number to guess -->
            <button class="button" id="buttonGenerate" onclick="generateRandom()">Wanna Try Again?</button>

            <br><br>
            <button onclick="window.location.href='javascriptProject2.html';">Next Project</button>

            <script src="jsPro1NumberGuess.js"></script>
        </div>
    </body>
</html>
